<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=1080,height=1920"/>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#050508}
    body{font-family:'Nunito','Inter',-apple-system,sans-serif;color:#fff}
    video{display:block;object-fit:cover;width:100%;height:100%}

    /* ════ 全局层 ════ */
    @keyframes bg-breathe{0%,100%{opacity:0.08}50%{opacity:0.12}}
    .vignette{position:fixed;inset:0;z-index:53;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,0.40) 100%)}
    .gold-pulse{position:fixed;inset:0;z-index:51;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 45%,rgba(245,166,35,0.04) 0%,transparent 55%);animation:bg-breathe 5s ease-in-out infinite}
    .bd{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,0.45) 0%,rgba(0,0,0,0.15) 40%,rgba(0,0,0,0.08) 65%,rgba(0,0,0,0.30) 100%);z-index:5}
    .ol{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 56px;pointer-events:none;z-index:10;text-align:center}
    .ol *{text-shadow:3px 3px 0 rgba(0,0,0,0.92),-3px -3px 0 rgba(0,0,0,0.92),3px -3px 0 rgba(0,0,0,0.92),-3px 3px 0 rgba(0,0,0,0.92),0 3px 0 rgba(0,0,0,0.92),3px 0 0 rgba(0,0,0,0.92),0 -3px 0 rgba(0,0,0,0.92),-3px 0 0 rgba(0,0,0,0.92),0 0 18px rgba(0,0,0,0.7)!important;font-weight:900!important}

    /* ── Hook ── */
    .hook-tag{font-size:22px;font-weight:800;color:#F5A623;letter-spacing:6px;text-transform:uppercase;margin-bottom:14px;border-radius:14px;padding:4px 16px;border:1px solid rgba(245,166,35,0.12)}
    .hook-tag::before{content:"🧳 "}
    .hook-line{font-size:64px;font-weight:900;line-height:1.08}
    .hook-sub{font-size:26px;font-weight:400;color:rgba(255,255,255,0.45);margin-top:14px;max-width:900px;line-height:1.3}
    /* Glitch layers (warm green variant) */
    @keyframes glitch-r{0%,90%,100%{transform:translate(0)}91%{transform:translate(-3px,1px)}93%{transform:translate(2px,-1px)}95%{transform:translate(-1px,1px)}97%{transform:translate(1px,-1px)}}
    @keyframes glitch-b{0%,90%,100%{transform:translate(0)}91%{transform:translate(2px,-1px)}93%{transform:translate(-2px,1px)}95%{transform:translate(1px,0)}97%{transform:translate(-1px,0)}}
    .glitch-r{position:absolute;color:#ff0040;mix-blend-mode:screen;z-index:1;opacity:0}
    .glitch-b{position:absolute;color:#8FAF8C;mix-blend-mode:screen;z-index:1;opacity:0}
    .glitch-g{position:relative;z-index:2;color:#F5A623}

    /* ── Number Module ── */
    .num-step{font-size:16px;font-weight:700;color:#F5A623;letter-spacing:5px;text-transform:uppercase;margin-bottom:8px}
    .num-big{font-size:180px;font-weight:900;color:#F5A623;line-height:1;margin-bottom:4px}
    .num-label{font-size:34px;font-weight:800;color:#fff;margin-bottom:10px}
    .num-desc{font-size:24px;font-weight:400;color:rgba(255,255,255,0.55);max-width:880px;line-height:1.4}
    .num-tag{display:inline-block;padding:8px 16px;border:1px solid rgba(245,166,35,0.2);border-radius:24px;font-size:16px;color:#F5A623;text-shadow:none!important;font-weight:700}

    /* ── Bars Module ── */
    .bars-wrap{width:100%;max-width:880px}
    .bars-headline{font-size:52px;font-weight:900;color:#fff;line-height:1.08;margin-bottom:8px}
    .bars-sub{font-size:18px;font-weight:400;color:rgba(255,255,255,0.5);margin-bottom:18px;max-width:860px;line-height:1.35}
    .bar-row{display:flex;align-items:center;gap:16px;margin-bottom:12px}
    .bar-label{font-size:26px;font-weight:700;color:#fff;min-width:180px;text-align:right}
    .bar-track{flex:1;height:64px;background:rgba(255,255,255,0.04);border-radius:16px;overflow:hidden;position:relative}
    .bar-fill{height:100%;width:0%;border-radius:16px;position:absolute;left:0;top:0}
    .bar-fill-gold{background:#F5A623;box-shadow:0 0 8px rgba(245,166,35,0.3)}
    .bar-fill-cyan{background:linear-gradient(90deg,rgba(74,222,128,0.2),#4ADE80)}
    .bar-fill-gray{background:linear-gradient(90deg,rgba(255,255,255,0.08),rgba(255,255,255,0.2))}
    .bar-pct{font-size:32px;font-weight:900;color:#F5A623;min-width:85px;text-align:left}

    /* ── Donut Module ── */
    .donut-wrap{display:flex;align-items:center;gap:30px}
    .donut-ring{position:relative;width:180px;height:180px}
    .donut-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
    .donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .donut-pct{font-size:48px;font-weight:900;color:#F5A623;text-shadow:none!important;line-height:1}
    .donut-label{font-size:14px;font-weight:600;color:rgba(255,255,255,0.4);text-shadow:none!important;margin-top:2px}
    .donut-info{flex:1;display:flex;flex-direction:column;gap:8px}
    .donut-headline{font-size:44px;font-weight:900;color:#fff;line-height:1.08;margin-bottom:4px}
    .donut-sub{font-size:18px;font-weight:400;color:rgba(255,255,255,0.5);line-height:1.35;max-width:500px}
    .donut-tag{display:inline-block;padding:5px 14px;border:1px solid rgba(245,166,35,0.2);border-radius:20px;font-size:14px;color:#F5A623;text-shadow:none!important;font-weight:700}

    /* ── Card Module (Soft Signal: 柔和漂移stagger + 左侧暖边条 + 大圆角) ── */
    .card-headline{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px 16px;font-size:48px;font-weight:900;line-height:1.2;margin-bottom:16px;position:relative;padding-left:24px;border-left:6px solid #F5A623;border-radius:0 20px 20px 0}
    .card-headline::before{content:"👨‍👩‍👧";position:absolute;left:-38px;top:50%;transform:translateY(-50%);font-size:28px;text-shadow:none!important}
    .card-word{display:inline-block}
    .card-kw{color:#F5A623}
    .card-sub{font-size:20px;font-weight:400;color:rgba(255,255,255,0.45);max-width:860px;line-height:1.35}
    .card-tag{display:inline-block;padding:5px 14px;border:1px solid rgba(245,166,35,0.15);border-radius:20px;font-size:15px;color:#F5A623;text-shadow:none!important;font-weight:700}
    .card-tag::before{content:"✨ "}
    .card-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px}

    /* ── Breathe Module ── */
    .breathe-tag{font-size:16px;font-weight:600;color:rgba(245,166,35,0.35);letter-spacing:5px;text-transform:uppercase;text-shadow:2px 2px 0 rgba(0,0,0,0.8),-2px -2px 0 rgba(0,0,0,0.8)!important}

    /* ── CTA (底部) ── */
    .cta-wrap{position:absolute;left:50%;bottom:140px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:18px;pointer-events:none;z-index:100}
    .cta-btn{display:inline-block;padding:26px 64px;background:#25D366;border-radius:50px;font-size:34px;font-weight:800;color:#fff;box-shadow:0 0 60px rgba(37,211,102,0.18);position:relative;text-shadow:none!important}
    .cta-ring{position:absolute;top:-10px;left:-10px;right:-10px;bottom:-10px;border-radius:60px;border:2px solid rgba(37,211,102,0.25)}
    .brand-row{display:flex;align-items:center;gap:10px;padding:12px 26px;background:rgba(0,0,0,0.35);border-radius:30px;border:1px solid rgba(255,255,255,0.05)}
    .brand-dot{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#f7971e,#ffd200)}
    .brand-txt{font-size:20px;font-weight:700;color:#F5A623;text-shadow:none!important}

    .prog-wrap{position:absolute;bottom:40px;left:56px;right:56px;height:3px;background:rgba(255,255,255,0.03);border-radius:3px;overflow:hidden;z-index:55}
    .prog-fill{height:100%;width:0%;background:linear-gradient(90deg,#F5A623,#F5A623);border-radius:3px}
    .flight-row{display:flex;align-items:center;gap:0;margin-top:22px;width:620px;position:relative}
    .flight-city{font-size:22px;font-weight:700;color:rgba(255,255,255,0.45);text-shadow:none!important}
    .flight-line{flex:1;height:2px;background:linear-gradient(90deg,rgba(245,166,35,0.3),rgba(245,166,35,0.3));border-radius:2px;position:relative;margin:0 8px}
    .flight-plane{font-size:36px;position:absolute;top:-20px;left:30%;text-shadow:none!important;z-index:15}
  </style>
</head>
<body>

<div class="gold-pulse" id="gold-pulse"></div>
<div class="vignette" id="vignette"></div>

<div id="root" data-composition-id="main" data-start="0" data-duration="{{TOTAL_DUR}}" data-width="1080" data-height="1920">
  {{VIDEO_TRACKS}}
  {{SCENES_HTML}}
  <div id="prog-wrap" class="prog-wrap clip" data-start="0" data-duration="{{TOTAL_DUR}}"><div id="prog-fill" class="prog-fill"></div></div>
  <audio id="tts" data-start="0" data-duration="{{TTS_DUR}}" src="{{TTS_SRC}}" data-volume="1.0"></audio>
  <audio id="bgm" data-start="0" data-duration="{{TOTAL_DUR}}" src="{{BGM_SRC}}" data-volume="0.12"></audio>
</div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });
{{SCENES_ANIMS}}
tl.to("#prog-fill",{width:"100%",duration:{{TOTAL_DUR}},ease:"none"},0.2);
tl.set({},{},{{TOTAL_DUR}});
window.__timelines["main"] = tl;
window.__hf = { duration: {{TOTAL_DUR}}, seek: function(t) { var tl = window.__timelines && window.__timelines["main"]; if (tl) tl.seek(t); } };
</script>
</body>
</html>
